name: Feature request
description: Propose a scoped improvement to the lab
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What learning, testing, or operational need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the externally observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler approaches or existing capabilities did you consider?
  - type: textarea
    id: contract
    attributes:
      label: Contract and compatibility effects
      description: Note expected changes to topology, routing policy, addresses, generated artifacts, pinned runtimes, or ADRs.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this capability.
          required: true
